name: Docker Build & Push

on:
  push:
    branches: [ "main", "dev", "dev-new" ]
  workflow_dispatch:

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Same Python as the Dockerfile; a failing test must not publish an image
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Run tests
      env:
        TZ: Europe/Helsinki
        GOOGLE_APPLICATION_CREDENTIALS: /nonexistent
      run: |
        pip install -r requirements.txt
        python -m pytest -q

    - name: Login to Docker Hub
      if: contains(fromJSON('["main", "dev", "dev-new"]'), github.ref_name)
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      if: contains(fromJSON('["main", "dev", "dev-new"]'), github.ref_name)
      uses: docker/setup-buildx-action@v3

    # Tag = branch name; publishing only from the three image branches (manual runs elsewhere just test)
    - name: Build and push image
      if: contains(fromJSON('["main", "dev", "dev-new"]'), github.ref_name)
      uses: docker/build-push-action@v5
      with:
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/gcalendar-discord-bot:${{ github.ref_name }}
